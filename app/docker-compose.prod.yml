# Production stack for a single Oracle Always Free ARM instance.
# One instance runs everything: app + Postgres + OpenSearch + Caddy.
# Only Caddy is exposed to the internet (ports 80/443). The rest stay private.
#
# Usage on the server (always pass --env-file so ${POSTGRES_PASSWORD} resolves):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# The in-process cron requires exactly ONE app instance. Do not scale.
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://shopify:${POSTGRES_PASSWORD}@postgres:5432/shopify_ai_search"
      OPENSEARCH_URL: "http://opensearch:9200"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    expose:
      - "3000"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shopify_ai_search
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopify -d shopify_ai_search"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  postgres-data:
  opensearch-data:
  caddy-data:
  caddy-config:
